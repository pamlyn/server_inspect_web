<aside class="w-64 bg-white shadow-lg flex flex-col z-20">
    <!-- Logo区域 -->
    <div class="p-4 border-b border-gray-100">
        <div class="flex items-center">
            <div

                <i class="fa fa-server text-lg" style="color: var(--primary-color);"></i>
            </div>
            <div>
                <h1 class="text-base font-bold text-gray-800">服务器巡检系统</h1>
                <p class="text-xs text-gray-500">实时监控 · 智能告警</p>
            </div>
        </div>
    </div>

    <!-- 界面偏好 -->
    <div class="appearance-panel">
        <div class="appearance-panel-title"><span>界面偏好</span><button type="button" onclick="resetWorkspacePreferences()">重置</button></div>
        <div class="appearance-field">
            <span>布局</span>
            <div class="appearance-options" role="group" aria-label="工作台布局">
                <button type="button" class="appearance-option" data-layout="sidebar" onclick="setLayoutMode('sidebar')" title="侧栏布局"><i class="fa fa-columns"></i></button>
                <button type="button" class="appearance-option" data-layout="sidebar-tabs" onclick="setLayoutMode('sidebar-tabs')" title="侧栏页签"><i class="fa fa-clone"></i></button>
                <button type="button" class="appearance-option" data-layout="topnav" onclick="setLayoutMode('topnav')" title="顶部导航"><i class="fa fa-bars"></i></button>
            </div>
        </div>
        <div class="appearance-field">
            <span>风格</span>
            <div class="appearance-options appearance-style-options" role="group" aria-label="视觉风格">
                <button type="button" class="appearance-option" data-style="mist" onclick="setVisualStyle('mist')">雾蓝</button>
                <button type="button" class="appearance-option" data-style="midnight" onclick="setVisualStyle('midnight')">深夜</button>
                <button type="button" class="appearance-option" data-style="warm" onclick="setVisualStyle('warm')">暖白</button>
            </div>
        </div>
        <div class="appearance-field">
            <span>强调色</span>
            <div class="accent-options" role="group" aria-label="强调色">

                <button type="button" class="accent-dot accent-green" data-accent="green" onclick="setAccentTheme('green')" title="绿色"></button>
                <button type="button" class="accent-dot accent-purple" data-accent="purple" onclick="setAccentTheme('purple')" title="紫色"></button>
                <button type="button" class="accent-dot accent-orange" data-accent="orange" onclick="setAccentTheme('orange')" title="橙色"></button>
                <button type="button" class="accent-dot accent-red" data-accent="red" onclick="setAccentTheme('red')" title="红色"></button>
                <button type="button" class="accent-dot accent-cyan" data-accent="cyan" onclick="setAccentTheme('cyan')" title="青色"></button>
            </div>
        </div>
    </div>

        <button data-type="custom_inspect" data-permission="custom_sql"

            </div>
            人员与权限

        </div>
        <button data-type="arthas"

        </button> -->
