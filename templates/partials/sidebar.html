<aside class="w-64 bg-white shadow-lg flex flex-col z-20">
    <!-- Logo区域 -->
    <div class="p-4 border-b border-gray-100">
        <div class="flex items-center">
            <div
                class="w-10 h-10 rounded-lg bg-gradient-to-br from-primary-light to-primary/20 flex items-center justify-center mr-3 border border-primary/20">
                <i class="fa fa-server text-lg" style="color: var(--primary-color);"></i>
            </div>
            <div>
                <h1 class="text-base font-bold text-gray-800">服务器巡检系统</h1>
                <p class="text-xs text-gray-500">实时监控 · 智能告警</p>
            </div>
        </div>
    </div>

    <!-- 主题选择器 -->
    <div class="px-4 py-3 border-b border-gray-100">
        <label class="text-xs font-medium text-gray-500 mb-2 block">主题颜色</label>
        <div class="flex gap-2">
            <button onclick="setTheme('theme-blue')"
                class="w-6 h-6 rounded-full bg-blue-500 hover:ring-2 ring-offset-1 ring-blue-500 transition-all"
                title="蓝色"></button>
            <button onclick="setTheme('theme-green')"
                class="w-6 h-6 rounded-full bg-emerald-500 hover:ring-2 ring-offset-1 ring-emerald-500 transition-all"
                title="绿色"></button>
            <button onclick="setTheme('theme-purple')"
                class="w-6 h-6 rounded-full bg-violet-500 hover:ring-2 ring-offset-1 ring-violet-500 transition-all"
                title="紫色"></button>
            <button onclick="setTheme('theme-orange')"
                class="w-6 h-6 rounded-full bg-amber-500 hover:ring-2 ring-offset-1 ring-amber-500 transition-all"
                title="橙色"></button>
            <button onclick="setTheme('theme-red')"
                class="w-6 h-6 rounded-full bg-red-500 hover:ring-2 ring-offset-1 ring-red-500 transition-all"
                title="红色"></button>
            <button onclick="setTheme('theme-cyan')"
                class="w-6 h-6 rounded-full bg-cyan-500 hover:ring-2 ring-offset-1 ring-cyan-500 transition-all"
                title="青色"></button>
        </div>
    </div>

    <!-- 导航按钮 -->
    <nav class="flex-1 overflow-y-auto p-3 space-y-1">
        <button data-type="config" id="configBtn"
            class="inspect-btn w-full text-left px-3 py-2.5 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm font-medium">
            <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-cog text-sm text-gray-600"></i>
            </div>
            系统配置
        </button>
        <button data-type="sql_inspect"
            class="inspect-btn w-full text-left px-3 py-2.5 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm font-medium">
            <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-search text-sm text-gray-600"></i>
            </div>
            数据稽查
        </button>
        <button data-type="custom_inspect"
            class="inspect-btn w-full text-left px-3 py-2.5 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm font-medium">
            <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-code text-sm text-gray-600"></i>
            </div>
            自定义稽核
        </button>
        <button data-type="logs"
            class="inspect-btn w-full text-left px-3 py-2.5 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm font-medium">
            <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-history text-sm text-gray-600"></i>
            </div>
            巡检日志
        </button>
        <!-- Arthas诊断工具 -->
        <!-- <div class="pt-2 border-t border-gray-100">
            <p class="px-3 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">诊断工具</p>
        </div>
        <button data-type="arthas"
            class="inspect-btn w-full text-left px-3 py-2.5 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm font-medium">
            <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-stethoscope text-sm text-gray-600"></i>
            </div>
            Arthas诊断
        </button> -->
        <button id="fullInspectBtn"
            class="inspect-btn w-full text-left px-3 py-2.5 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm font-medium mb-3">
            <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-refresh text-sm text-gray-600"></i>
            </div>
            完整巡检
        </button>
        <div class="pt-2 border-t border-gray-100">
            <p class="px-3 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">快速巡检</p>
        </div>
        <button data-type="system_info"
            class="inspect-btn w-full text-left px-3 py-2 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm">
            <div class="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-info-circle text-xs text-gray-600"></i>
            </div>
            系统信息
        </button>
        <button data-type="cpu"
            class="inspect-btn w-full text-left px-3 py-2 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm">
            <div class="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-microchip text-xs text-gray-600"></i>
            </div>
            CPU
        </button>
        <button data-type="memory"
            class="inspect-btn w-full text-left px-3 py-2 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm">
            <div class="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-braille text-xs text-gray-600"></i>
            </div>
            内存
        </button>
        <button data-type="disk"
            class="inspect-btn w-full text-left px-3 py-2 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm">
            <div class="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-hdd-o text-xs text-gray-600"></i>
            </div>
            磁盘
        </button>
        <button data-type="network"
            class="inspect-btn w-full text-left px-3 py-2 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm">
            <div class="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-wifi text-xs text-gray-600"></i>
            </div>
            网络
        </button>
        <button data-type="processes"
            class="inspect-btn w-full text-left px-3 py-2 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm">
            <div class="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-tasks text-xs text-gray-600"></i>
            </div>
            进程
        </button>
        <button data-type="swap"
            class="inspect-btn w-full text-left px-3 py-2 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm">
            <div class="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-exchange text-xs text-gray-600"></i>
            </div>
            交换分区
        </button>
        <button data-type="disk_io"
            class="inspect-btn w-full text-left px-3 py-2 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm">
            <div class="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-exchange text-xs text-gray-600"></i>
            </div>
            磁盘IO
        </button>
        <button data-type="slow_sql"
            class="inspect-btn w-full text-left px-3 py-2 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm">
            <div class="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-database text-xs text-gray-600"></i>
            </div>
            慢SQL
        </button>
        <button data-type="database"
            class="inspect-btn w-full text-left px-3 py-2 rounded-lg flex items-center transition-all duration-200 hover:bg-gray-50 text-gray-700 text-sm">
            <div class="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                <i class="fa fa-server text-xs text-gray-600"></i>
            </div>
            数据库
        </button>
    </nav>

    <!-- 底部按钮 -->
    <div class="p-3 border-t border-gray-100">
        <button id="clearLogsBtn"
            class="w-full text-left px-3 py-2.5 rounded-lg flex items-center transition-all duration-200 text-white text-sm font-medium"
            style="background: linear-gradient(to right, #ef4444, #dc2626);">
            <div class="w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center mr-3">
                <i class="fa fa-trash text-sm"></i>
            </div>
            清理慢SQL日志
        </button>
    </div>
</aside>
