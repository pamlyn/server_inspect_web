<div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="dailyInspectSystemInfo" class="w-4 h-4 rounded border-gray-300"><span class="ml-2 text-sm text-gray-700">系统信息</span></label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="dailyInspectCpu" class="w-4 h-4 rounded border-gray-300"><span class="ml-2 text-sm text-gray-700">CPU</span></label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="dailyInspectMemory" class="w-4 h-4 rounded border-gray-300"><span class="ml-2 text-sm text-gray-700">内存</span></label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="dailyInspectSwap" class="w-4 h-4 rounded border-gray-300"><span class="ml-2 text-sm text-gray-700">交换分区</span></label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="dailyInspectDisk" class="w-4 h-4 rounded border-gray-300"><span class="ml-2 text-sm text-gray-700">磁盘</span></label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="dailyInspectDiskIo" class="w-4 h-4 rounded border-gray-300"><span class="ml-2 text-sm text-gray-700">磁盘IO</span></label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="dailyInspectProcesses" class="w-4 h-4 rounded border-gray-300"><span class="ml-2 text-sm text-gray-700">进程</span></label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="dailyInspectSlowSql" class="w-4 h-4 rounded border-gray-300"><span class="ml-2 text-sm text-gray-700">慢SQL</span></label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="dailyInspectDatabase" class="w-4 h-4 rounded border-gray-300"><span class="ml-2 text-sm text-gray-700">数据库</span></label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="dailyInspectNetwork" class="w-4 h-4 rounded border-gray-300"><span class="ml-2 text-sm text-gray-700">网络</span></label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="dailyInspectWorkerOutput" class="w-4 h-4 rounded border-gray-300"><span class="ml-2 text-sm text-gray-700">工人产量与报工明细稽核（含颜色尺码）</span></label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="dailyInspectWorkerOutputWithoutColorSize" class="w-4 h-4 rounded border-gray-300"><span class="ml-2 text-sm text-gray-700">工人产量与报工明细稽核（不含颜色尺码）</span></label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="dailyInspectWorkerOutputSfd" class="w-4 h-4 rounded border-gray-300"><span class="ml-2 text-sm text-gray-700">工人产量与报工明细数据稽核(sfd)</span></label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="checkbox" id="dailyInspectMesHanging" class="w-4 h-4 rounded border-gray-300"><span class="ml-2 text-sm text-gray-700">MES报工明细与吊挂报工明细稽核</span></label>
    </div>
