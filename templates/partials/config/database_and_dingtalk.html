<!-- 数据库连接配置 -->
<div class="border border-gray-200 rounded-lg p-4">
    <div class="flex items-center justify-between mb-4">
        <h3 class="text-sm font-semibold text-gray-700 flex items-center">
            <i class="fa fa-database mr-2" style="color: var(--primary-color);"></i>
            数据库连接配置
        </h3>
        <button type="button" id="addDatabaseConfigBtn"
            class="px-3 py-1 bg-green-500 text-white text-xs rounded hover:bg-green-600 transition-all">
            <i class="fa fa-plus mr-1"></i>新增数据库配置
        </button>
    </div>

    <!-- 数据库配置列表容器 -->
    <div id="databaseConfigsContainer" class="space-y-4">
        <!-- 数据库配置项将通过JavaScript动态生成 -->
    </div>
</div>

<!-- 钉钉通知配置 -->
<div class="border border-gray-200 rounded-lg p-4">
    <h3 class="text-sm font-semibold text-gray-700 mb-4 flex items-center">
        <i class="fa fa-bell mr-2" style="color: var(--primary-color);"></i>
        钉钉通知配置
    </h3>
    <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">是否启用</label>
            <select id="dingtalkEnabled"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                style="--tw-ring-color: var(--primary-color);">
                <option value="true">启用</option>
                <option value="false">禁用</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">显示异常详情</label>
            <select id="dingtalkShowDetails"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                style="--tw-ring-color: var(--primary-color);">
                <option value="true">显示</option>
                <option value="false">不显示</option>
            </select>
        </div>
    </div>
    <div class="space-y-3">
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Webhook地址1</label>
            <input type="text" id="dingtalkWebhook1"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                style="--tw-ring-color: var(--primary-color);"
                placeholder="输入钉钉机器人webhook1">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Webhook地址2</label>
            <input type="text" id="dingtalkWebhook2"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                style="--tw-ring-color: var(--primary-color);"
                placeholder="输入钉钉机器人webhook2">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Webhook地址3</label>
            <input type="text" id="dingtalkWebhook3"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                style="--tw-ring-color: var(--primary-color);"
                placeholder="输入钉钉机器人webhook3">
        </div>
    </div>
</div>
