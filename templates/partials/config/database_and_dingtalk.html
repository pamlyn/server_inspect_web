<!-- 数据库连接配置 -->
<div class="border border-gray-200 rounded-lg p-4">
    <h3 class="text-sm font-semibold text-gray-700 mb-4 flex items-center">
        <i class="fa fa-database mr-2" style="color: var(--primary-color);"></i>
        数据库连接配置
    </h3>

    <!-- MES数据库配置 -->
    <div class="mb-4">
        <h4 class="text-xs font-medium text-gray-600 mb-2">MES数据库配置</h4>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">数据库类型</label>
                <select id="mesDatabaseType"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);">
                    <option value="postgresql">PostgreSQL</option>
                    <option value="mysql">MySQL</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">主机</label>
                <input type="text" id="mesHost"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);" placeholder="localhost">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">端口</label>
                <input type="number" id="mesPort"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);" min="1" max="65535">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">用户名</label>
                <input type="text" id="mesUser"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);" placeholder="postgres">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">密码</label>
                <input type="password" id="mesPassword"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);" placeholder="password">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">数据库名</label>
                <input type="text" id="mesDatabase"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);" placeholder="mes">
            </div>
        </div>
    </div>

    <!-- 吊挂中间库配置 -->
    <div>
        <h4 class="text-xs font-medium text-gray-600 mb-2">吊挂中间库配置</h4>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">数据库类型</label>
                <select id="hangingDatabaseType"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);">
                    <option value="postgresql">PostgreSQL</option>
                    <option value="mysql">MySQL</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">主机</label>
                <input type="text" id="hangingHost"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);" placeholder="localhost">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">端口</label>
                <input type="number" id="hangingPort"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);" min="1" max="65535">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">用户名</label>
                <input type="text" id="hangingUser"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);" placeholder="root">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">密码</label>
                <input type="password" id="hangingPassword"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);" placeholder="password">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">数据库名</label>
                <input type="text" id="hangingDatabase"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);" placeholder="middle">
            </div>
        </div>
    </div>
</div>

<!-- 钉钉通知配置 -->
<div class="border border-gray-200 rounded-lg p-4">
    <h3 class="text-sm font-semibold text-gray-700 mb-4 flex items-center">
        <i class="fa fa-bell mr-2" style="color: var(--primary-color);"></i>
        钉钉通知配置
    </h3>
    <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">是否启用</label>
            <select id="dingtalkEnabled"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                style="--tw-ring-color: var(--primary-color);">
                <option value="true">启用</option>
                <option value="false">禁用</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">显示异常详情</label>
            <select id="dingtalkShowDetails"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                style="--tw-ring-color: var(--primary-color);">
                <option value="true">显示</option>
                <option value="false">不显示</option>
            </select>
        </div>
    </div>
    <div class="space-y-3">
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Webhook地址1</label>
            <input type="text" id="dingtalkWebhook1"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                style="--tw-ring-color: var(--primary-color);"
                placeholder="输入钉钉机器人webhook1">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Webhook地址2</label>
            <input type="text" id="dingtalkWebhook2"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                style="--tw-ring-color: var(--primary-color);"
                placeholder="输入钉钉机器人webhook2">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Webhook地址3</label>
            <input type="text" id="dingtalkWebhook3"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                style="--tw-ring-color: var(--primary-color);"
                placeholder="输入钉钉机器人webhook3">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Secret (可选)</label>
            <input type="text" id="dingtalkSecret"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                style="--tw-ring-color: var(--primary-color);" placeholder="输入钉钉机器人secret">
        </div>
    </div>
</div>

<!-- 保存按钮 -->
<div class="flex justify-end space-x-3 pt-4">
    <button type="button" id="cancelConfigBtn"
        class="px-4 py-2 text-sm border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-all">
        取消
    </button>
    <button type="submit"
        class="px-4 py-2 text-sm text-white rounded-lg transition-all hover:opacity-90"
        style="background: var(--primary-color);">
        保存配置
    </button>
</div>
