<!-- 项目配置 -->
<div class="border border-gray-200 rounded-lg p-4">
    <h3 class="text-sm font-semibold text-gray-700 mb-4 flex items-center">
        <i class="fa fa-project-diagram mr-2" style="color: var(--primary-color);"></i>
        项目配置
    </h3>
    <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">项目名称</label>
        <input type="text" id="projectName"
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
            style="--tw-ring-color: var(--primary-color);" placeholder="输入项目名称">
    </div>
</div>

<!-- 告警阈值配置 -->
<div class="border border-gray-200 rounded-lg p-4">
    <h3 class="text-sm font-semibold text-gray-700 mb-4 flex items-center">
        <i class="fa fa-sliders mr-2" style="color: var(--primary-color);"></i>
        告警阈值配置
    </h3>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div><label class="block text-xs font-medium text-gray-600 mb-1">CPU警告(%)</label><input type="number" id="cpuWarningThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" style="--tw-ring-color: var(--primary-color);" min="1" max="100" value="80"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">CPU紧急(%)</label><input type="number" id="cpuCriticalThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" style="--tw-ring-color: var(--primary-color);" min="1" max="100" value="90"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">内存警告(%)</label><input type="number" id="memoryWarningThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" style="--tw-ring-color: var(--primary-color);" min="1" max="100" value="80"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">内存紧急(%)</label><input type="number" id="memoryCriticalThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" style="--tw-ring-color: var(--primary-color);" min="1" max="100" value="90"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">磁盘警告(%)</label><input type="number" id="diskWarningThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" style="--tw-ring-color: var(--primary-color);" min="1" max="100" value="80"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">磁盘紧急(%)</label><input type="number" id="diskCriticalThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" style="--tw-ring-color: var(--primary-color);" min="1" max="100" value="90"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">负载/核警告</label><input type="number" id="cpuLoadWarningThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" step="0.1" min="0.1" value="1"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">负载/核紧急</label><input type="number" id="cpuLoadCriticalThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" step="0.1" min="0.1" value="1.5"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">CPU IO等待警告(%)</label><input type="number" id="cpuIowaitWarningThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" min="1" max="100" value="10"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">CPU IO等待紧急(%)</label><input type="number" id="cpuIowaitCriticalThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" min="1" max="100" value="25"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">可用内存警告(%)</label><input type="number" id="memoryAvailableWarningThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" min="1" max="100" value="20"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">可用内存紧急(%)</label><input type="number" id="memoryAvailableCriticalThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" min="1" max="100" value="10"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">Inode警告(%)</label><input type="number" id="inodeWarningThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" min="1" max="100" value="80"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">Inode紧急(%)</label><input type="number" id="inodeCriticalThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" min="1" max="100" value="90"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">磁盘IO等待警告(%)</label><input type="number" id="diskIoWarningThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" min="1" max="100" value="10"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">磁盘IO等待紧急(%)</label><input type="number" id="diskIoCriticalThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" min="1" max="100" value="25"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">交换分区警告(%)</label><input type="number" id="swapWarningThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" min="1" max="100" value="30"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">交换分区紧急(%)</label><input type="number" id="swapCriticalThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" min="1" max="100" value="50"></div>
        <label class="flex items-center gap-2 text-xs font-medium text-gray-600 cursor-pointer"><input type="checkbox" id="swapActivityEnabled" class="w-4 h-4 rounded border-gray-300">启用短窗口换页速率告警</label>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">换页速率警告(页/秒)</label><input type="number" id="swapActivityWarningThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" min="1" value="100"><p class="mt-1 text-xs text-gray-500">默认关闭；仅持续高频换页通常表示内存压力。</p></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">换页速率紧急(页/秒)</label><input type="number" id="swapActivityCriticalThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" min="1" value="500"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">慢SQL警告(数量)</label><input type="number" id="slowSqlWarningThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" style="--tw-ring-color: var(--primary-color);" min="1" value="5"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">慢SQL紧急(数量)</label><input type="number" id="slowSqlCriticalThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" style="--tw-ring-color: var(--primary-color);" min="1" value="10"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">磁盘剩余空间警告(GB)</label><input type="number" id="diskFreeWarningThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" style="--tw-ring-color: var(--primary-color);" min="1" value="10"></div>
        <div><label class="block text-xs font-medium text-gray-600 mb-1">磁盘剩余空间紧急(GB)</label><input type="number" id="diskFreeCriticalThreshold" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all" style="--tw-ring-color: var(--primary-color);" min="1" value="5"></div>
    </div>
</div>
