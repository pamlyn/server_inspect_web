<!-- 定时巡检项配置 -->
<div class="border border-gray-200 rounded-lg p-4">
    <h3 class="text-sm font-semibold text-gray-700 mb-4 flex items-center">
        <i class="fa fa-clock-o mr-2" style="color: var(--primary-color);"></i>
        定时巡检项配置
    </h3>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" id="scheduledInspectSystemInfo" class="w-4 h-4 rounded border-gray-300">
            <span class="ml-2 text-sm text-gray-700">系统信息</span>
        </label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" id="scheduledInspectCpu" class="w-4 h-4 rounded border-gray-300">
            <span class="ml-2 text-sm text-gray-700">CPU</span>
        </label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" id="scheduledInspectMemory" class="w-4 h-4 rounded border-gray-300">
            <span class="ml-2 text-sm text-gray-700">内存</span>
        </label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" id="scheduledInspectSwap" class="w-4 h-4 rounded border-gray-300">
            <span class="ml-2 text-sm text-gray-700">交换分区</span>
        </label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" id="scheduledInspectDisk" class="w-4 h-4 rounded border-gray-300">
            <span class="ml-2 text-sm text-gray-700">磁盘</span>
        </label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" id="scheduledInspectDiskIo" class="w-4 h-4 rounded border-gray-300">
            <span class="ml-2 text-sm text-gray-700">磁盘IO</span>
        </label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" id="scheduledInspectProcesses" class="w-4 h-4 rounded border-gray-300">
            <span class="ml-2 text-sm text-gray-700">进程</span>
        </label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" id="scheduledInspectSlowSql" class="w-4 h-4 rounded border-gray-300">
            <span class="ml-2 text-sm text-gray-700">慢SQL</span>
        </label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" id="scheduledInspectDatabase" class="w-4 h-4 rounded border-gray-300">
            <span class="ml-2 text-sm text-gray-700">数据库</span>
        </label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" id="scheduledInspectNetwork" class="w-4 h-4 rounded border-gray-300">
            <span class="ml-2 text-sm text-gray-700">网络</span>
        </label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" id="scheduledInspectWorkerOutput" class="w-4 h-4 rounded border-gray-300">
            <span class="ml-2 text-sm text-gray-700">工人产量与报工明细稽核（含颜色尺码）</span>
        </label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" id="scheduledInspectWorkerOutputWithoutColorSize" class="w-4 h-4 rounded border-gray-300">
            <span class="ml-2 text-sm text-gray-700">工人产量与报工明细稽核（不含颜色尺码）</span>
        </label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" id="scheduledInspectWorkerOutputSfd" class="w-4 h-4 rounded border-gray-300">
            <span class="ml-2 text-sm text-gray-700">工人产量与报工明细数据稽核(sfd)</span>
        </label>
        <label class="flex items-center p-2 border rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="checkbox" id="scheduledInspectMesHanging" class="w-4 h-4 rounded border-gray-300">
            <span class="ml-2 text-sm text-gray-700">MES报工明细与吊挂报工明细稽核</span>
        </label>
    </div>
</div>
