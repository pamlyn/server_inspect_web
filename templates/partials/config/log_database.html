<!-- 日志保存数据库配置 -->
<div class="border border-gray-200 rounded-lg p-4">
    <h3 class="text-sm font-semibold text-gray-700 mb-4 flex items-center">
        <i class="fa fa-database mr-2" style="color: var(--primary-color);"></i>
        日志保存数据库配置
    </h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">是否启用</label>
            <select id="logDbEnabled"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                style="--tw-ring-color: var(--primary-color);">
                <option value="true">启用</option>
                <option value="false">禁用</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">数据库类型</label>
            <select id="logDbType"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                style="--tw-ring-color: var(--primary-color);">
                <option value="postgresql">PostgreSQL</option>
                <option value="mysql">MySQL</option>
            </select>
        </div>
    </div>
    <div id="logDbConfig" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">主机地址</label>
                <input type="text" id="logDbHost"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);" placeholder="输入数据库主机地址">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">端口</label>
                <input type="number" id="logDbPort"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);" placeholder="输入数据库端口">
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">用户名</label>
                <input type="text" id="logDbUser"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);" placeholder="输入数据库用户名">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">密码</label>
                <input type="password" id="logDbPassword"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                    style="--tw-ring-color: var(--primary-color);" placeholder="输入数据库密码">
            </div>
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">数据库名</label>
            <input type="text" id="logDbName"
                class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 transition-all"
                style="--tw-ring-color: var(--primary-color);" placeholder="输入数据库名">
        </div>
        <div>
            <button type="button" id="testLogDbConnection"
                class="px-3 py-1 bg-blue-500 text-white text-xs rounded hover:bg-blue-600 transition-all">
                <i class="fa fa-check-circle mr-1"></i>测试连接并创建表
            </button>
            <span id="logDbTestResult" class="ml-2 text-xs"></span>
        </div>
    </div>
</div>
